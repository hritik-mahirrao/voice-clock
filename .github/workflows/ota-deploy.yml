name: Deploy OTA Update
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install dependencies
        run: npm install
        
      - name: Build Web App
        run: npm run build
        
      - name: Zip Dist Folder
        run: |
          cd dist
          zip -r ../dist.zip *
          cd ..
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ota-${{ github.sha }}
          name: OTA Update ${{ github.sha }}
          files: dist.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Create update.json
        run: |
          mkdir -p ota-public
          echo '{' > ota-public/update.json
          echo '  "version": "'${{ github.sha }}'",' >> ota-public/update.json
          echo '  "url": "https://github.com/${{ github.repository }}/releases/download/ota-${{ github.sha }}/dist.zip"' >> ota-public/update.json
          echo '}' >> ota-public/update.json
          
      - name: Deploy update.json to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./ota-public
          publish_branch: gh-pages
