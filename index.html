<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voice Clock</title>
    <meta name="description" content="A powerful voice clock, timer, and stopwatch with speech synthesis.">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Header / Navigation -->
        <header class="top-nav">
            <button class="menu-btn"><i class="fas fa-bars"></i></button>
            <div class="tabs">
                <button class="tab-btn" data-target="clock"><i class="far fa-clock"></i> Clock</button>
                <button class="tab-btn active" data-target="timer"><i class="fas fa-hourglass-half"></i> Timer</button>
                <button class="tab-btn" data-target="stopwatch"><i class="fas fa-stopwatch"></i> Stopwatch</button>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="content-area">
            
            <!-- Clock Tab -->
            <section id="clock" class="tab-content">
                <div class="display-container clock-display-container">
                    <div class="time-display" id="clock-display">00:00:00</div>
                    <div class="date-display" id="date-display">Monday, Jan 1</div>
                </div>
            </section>

            <!-- Timer Tab -->
            <section id="timer" class="tab-content active">
                <div class="toolbar">
                    <button><i class="fas fa-volume-up"></i></button>
                    <button class="active-blue"><i class="fas fa-palette"></i></button>
                    <button><i class="fas fa-font"></i></button>
                    <button><i class="fas fa-cog"></i></button>
                </div>
                
                <div class="display-container blue-theme">
                    <div class="time-display timer-display">
                        <span id="timer-h">00</span><span class="colon">:</span><span id="timer-m">00</span><span class="colon">:</span><span id="timer-s">00</span>
                    </div>
                    <div class="time-labels">
                        <span>h</span><span>m</span><span>s</span>
                    </div>
                </div>

                <div class="settings-panel">
                    <div class="setting-row">
                        <label>Countdown before starting</label>
                        <select id="timer-pre-countdown">
                            <option value="0">0s</option>
                            <option value="3">3s</option>
                            <option value="5">5s</option>
                            <option value="10">10s</option>
                        </select>
                        <button class="icon-btn"><i class="fas fa-volume-up"></i></button>
                    </div>
                    <div class="setting-row">
                        <label class="checkbox-label">
                            <input type="checkbox" id="timer-interval-check" checked>
                            <span class="custom-checkbox"></span> Interval
                        </label>
                        <select id="timer-interval-val">
                            <option value="30">30s</option>
                            <option value="60" selected>60s</option>
                            <option value="300">5m</option>
                        </select>
                        <label class="checkbox-label">
                            <input type="checkbox" id="timer-interval-speak" checked>
                            <span class="custom-checkbox"></span> Speaking
                        </label>
                        <button class="icon-btn"><i class="fas fa-bell-slash"></i></button>
                    </div>
                    <div class="setting-row">
                        <label class="checkbox-label">
                            <input type="checkbox" id="timer-countdown-check" checked>
                            <span class="custom-checkbox"></span> Countdown
                        </label>
                        <select id="timer-countdown-val">
                            <option value="5">5s</option>
                            <option value="10" selected>10s</option>
                        </select>
                        <label class="checkbox-label">
                            <input type="checkbox" id="timer-countdown-speak" checked>
                            <span class="custom-checkbox"></span> Speaking
                        </label>
                        <button class="icon-btn"><i class="fas fa-bell-slash"></i></button>
                    </div>
                </div>

                <div class="controls-container">
                    <div class="quick-add">
                        <button class="icon-btn"><i class="fas fa-list"></i></button>
                        <button class="quick-btn" data-add="300">+5m</button>
                        <button class="quick-btn" data-add="60">+1m</button>
                    </div>
                    
                    <button class="main-action-btn blue-btn" id="timer-play-btn">
                        <i class="fas fa-play"></i>
                    </button>
                    
                    <div class="quick-add">
                        <button class="icon-btn" id="timer-reset-btn"><i class="fas fa-redo"></i></button>
                        <button class="quick-btn" data-add="10">+10s</button>
                        <button class="quick-btn" data-add="30">+30s</button>
                    </div>
                </div>
            </section>

            <!-- Stopwatch Tab -->
            <section id="stopwatch" class="tab-content">
                <div class="display-container pink-theme">
                    <div class="time-display stopwatch-display">
                        <span id="sw-h">00</span><span class="colon">:</span><span id="sw-m">00</span><span class="colon">:</span><span id="sw-s">00</span><span class="ms" id="sw-ms">00</span>
                    </div>
                    <div class="time-labels">
                        <span>h</span><span>m</span><span>s</span>
                    </div>
                </div>

                <div class="settings-panel">
                    <div class="setting-row">
                        <label class="checkbox-label">
                            <input type="checkbox" id="sw-interval-check" checked>
                            <span class="custom-checkbox pink-check"></span> Interval
                        </label>
                        <select id="sw-interval-val">
                            <option value="10">10s</option>
                            <option value="30" selected>30s</option>
                            <option value="60">60s</option>
                        </select>
                        <label class="checkbox-label">
                            <input type="checkbox" id="sw-interval-speak" checked>
                            <span class="custom-checkbox pink-check"></span> Speaking
                        </label>
                    </div>
                    <div class="setting-row">
                        <label class="checkbox-label">
                            <input type="checkbox" id="sw-lap-time-speak" checked>
                            <span class="custom-checkbox pink-check"></span> Speak lap time
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="sw-lap-total-speak">
                            <span class="custom-checkbox pink-check"></span> Speak lap total
                        </label>
                    </div>
                </div>

                <div class="laps-container" id="laps-list">
                    <!-- Laps will be added here dynamically -->
                </div>

                <div class="controls-container">
                    <button class="text-btn" id="sw-reset-btn">Reset</button>
                    <button class="main-action-btn pink-btn" id="sw-play-btn">
                        <i class="fas fa-play"></i>
                    </button>
                    <button class="text-btn" id="sw-lap-btn">Lap</button>
                </div>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
